name: Deploy website and travel calendar

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out personal website
        uses: actions/checkout@v4

      - name: Check out travel calendar app
        uses: actions/checkout@v4
        with:
          repository: chinwayland/travel-calendar
          ref: main
          path: .calendar-source

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: .calendar-source/pnpm-lock.yaml

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install calendar dependencies
        working-directory: .calendar-source
        run: pnpm install --frozen-lockfile

      - name: Test calendar parser
        working-directory: .calendar-source
        run: pnpm test

      - name: Download private calendar feed
        env:
          TRIPIT_ICAL_URL: ${{ secrets.TRIPIT_ICAL_URL }}
        run: |
          test -n "$TRIPIT_ICAL_URL"
          curl --fail --show-error --silent --location \
            --retry 3 --retry-all-errors \
            --connect-timeout 10 --max-time 60 \
            "$TRIPIT_ICAL_URL" \
            --output "$RUNNER_TEMP/tripit.ics"

      - name: Prepare privacy-safe calendar data
        working-directory: .calendar-source
        run: node scripts/build-calendar-data.mjs --input "$RUNNER_TEMP/tripit.ics" --output public/calendar-data.json

      - name: Build travel calendar
        working-directory: .calendar-source
        env:
          NEXT_PUBLIC_BASE_PATH: /travel-calendar
          NEXT_PUBLIC_SITE_URL: https://waylandchin.com/travel-calendar
        run: pnpm build

      - name: Prepare calendar for GitHub Pages
        working-directory: .calendar-source
        env:
          NEXT_PUBLIC_BASE_PATH: /travel-calendar
        run: pnpm pages:prepare

      - name: Assemble complete website artifact
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          rsync -a \
            --exclude='.git*' \
            --exclude='.github/' \
            --exclude='.calendar-source/' \
            ./ "$RUNNER_TEMP/site/"
          mkdir -p "$RUNNER_TEMP/site/travel-calendar"
          cp -R .calendar-source/dist/client/. "$RUNNER_TEMP/site/travel-calendar/"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 5
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
